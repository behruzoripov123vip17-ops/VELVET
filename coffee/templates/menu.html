{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KOPPEE – Coffee Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --cream: #fdf6ee;
            --warm-white: #faf4ed;
            --petal: #e8c4a8;
            --coffee: #8B5E3C;
            --espresso: #3d2314;
            --mocha: #a0704a;
            --card-bg: #f5ede4;
            --card-hover: #edddd0;
            --text-main: #2e1a0e;
            --text-muted: #9a7a65;
            --shadow: 0 4px 24px rgba(61, 35, 20, 0.08);
            --shadow-hover: 0 12px 36px rgba(61, 35, 20, 0.16);
        }

        body {
            background: var(--cream);
            font-family: 'Lato', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
        }

        /* ── Floating petals (decorative) ── */
        .petals {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            width: 8px;
            height: 14px;
            background: var(--petal);
            border-radius: 50% 50% 50% 0;
            opacity: 0.35;
            animation: fallPetal linear infinite;
        }

        @keyframes fallPetal {
            0% {
                transform: translateY(-40px) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.35;
            }

            90% {
                opacity: 0.2;
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* ── Page wrapper ── */
        .page {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 32px 80px;
        }

        /* ── Section header ── */
        .section-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 36px;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 4vw, 2.8rem);
            font-weight: 700;
            color: var(--espresso);
            letter-spacing: -0.02em;
        }

        .section-title span {
            color: var(--mocha);
        }

        .view-all {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--mocha);
            text-decoration: none;
            border: 1.5px solid var(--petal);
            padding: 7px 18px;
            border-radius: 100px;
            letter-spacing: 0.04em;
            transition: background 0.2s, color 0.2s;
        }

        .view-all:hover {
            background: var(--mocha);
            color: #fff;
        }

        .view-all svg {
            transition: transform 0.2s;
        }

        .view-all:hover svg {
            transform: translateX(3px);
        }

        /* ── Category Grid ── */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        @media (max-width: 640px) {
            .categories-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* ── Category Card ── */
        .cat-card {
            position: relative;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 22px 20px 20px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 14px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.28s cubic-bezier(.34, 1.56, .64, 1),
                box-shadow 0.28s ease,
                background 0.2s ease;
            animation: cardIn 0.5s ease backwards;
        }

        .cat-card:hover {
            transform: translateY(-6px) scale(1.015);
            box-shadow: var(--shadow-hover);
            background: var(--card-hover);
        }

        .cat-card:hover .cat-arrow {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .cat-card:hover .cat-emoji {
            transform: scale(1.12) rotate(-4deg);
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .cat-card:nth-child(1) {
            animation-delay: 0.05s;
        }

        .cat-card:nth-child(2) {
            animation-delay: 0.10s;
        }

        .cat-card:nth-child(3) {
            animation-delay: 0.15s;
        }

        .cat-card:nth-child(4) {
            animation-delay: 0.20s;
        }

        .cat-card:nth-child(5) {
            animation-delay: 0.25s;
        }

        .cat-card:nth-child(6) {
            animation-delay: 0.30s;
        }

        /* Accent top stripe */
        .cat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--mocha), var(--petal));
            opacity: 0;
            transition: opacity 0.25s;
        }

        .cat-card:hover::before {
            opacity: 1;
        }

        .cat-label {
            font-family: 'Lato', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .cat-name {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.05rem, 2vw, 1.25rem);
            font-weight: 600;
            color: var(--espresso);
            line-height: 1.2;
        }

        /* Image area */
        .cat-img-wrap {
            width: 100%;
            aspect-ratio: 1 / 0.85;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.55);
            position: relative;
        }

        .cat-emoji {
            font-size: clamp(3rem, 6vw, 4.5rem);
            transition: transform 0.3s cubic-bezier(.34, 1.56, .64, 1);
            user-select: none;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.12));
        }

        /* Arrow overlay on hover */
        .cat-arrow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            width: 44px;
            height: 44px;
            background: var(--espresso);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.22s, transform 0.28s cubic-bezier(.34, 1.56, .64, 1);
        }

        .cat-arrow svg {
            color: #fff;
        }

        /* ── "All categories" special card ── */
        .cat-card.all-categories {
            background: var(--espresso);
            justify-content: space-between;
            min-height: 160px;
        }

        .cat-card.all-categories .cat-name,
        .cat-card.all-categories .cat-label {
            color: rgba(255, 255, 255, 0.85);
        }

        .cat-card.all-categories::before {
            display: none;
        }

        .cat-card.all-categories:hover {
            background: #2a1509;
        }

        .cat-card.all-categories .all-arrow {
            width: 52px;
            height: 52px;
            background: var(--mocha);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            align-self: flex-end;
            transition: transform 0.25s cubic-bezier(.34, 1.56, .64, 1), background 0.2s;
        }

        .cat-card.all-categories:hover .all-arrow {
            transform: scale(1.12);
            background: var(--petal);
        }

        /* ── Search bar (matches mobile app look) ── */
        .search-wrap {
            margin-bottom: 40px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.8);
            border: 1.5px solid #e8d8cc;
            border-radius: 100px;
            padding: 14px 22px;
            backdrop-filter: blur(8px);
            box-shadow: 0 2px 12px rgba(61, 35, 20, 0.06);
        }

        .search-bar input {
            border: none;
            background: transparent;
            font-family: 'Lato', sans-serif;
            font-size: 0.95rem;
            color: var(--text-main);
            flex: 1;
            outline: none;
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
        }

        .search-bar svg {
            color: var(--text-muted);
            flex-shrink: 0;
        }
    </style>
</head>

<body>

    <!-- Floating petals -->
    <div class="petals" id="petals"></div>

    <div class="page">

        <!-- Search -->
        <form action="{% url 'coffee:menu' %}" method="get" class="search-wrap">
            <div class="search-bar">
                <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.35-4.35" />
                </svg>
                <input type="text" name="search" placeholder="Quick search…"
                    value="{{ request.GET.search|default:'' }}" />
            </div>
        </form>

        <!-- Section header -->
        <div class="section-header">
            <h2 class="section-title">Our <span>Menu</span></h2>
            <a href="{% url 'coffee:menu' %}" class="view-all">
                All Items
                <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </a>
        </div>

        <!-- Categories grid -->
        <div class="categories-grid">

            <!-- Coffee -->
            <a class="cat-card" href="{% url 'coffee:menu' %}?category=HOT">
                <div>
                    <div class="cat-label">Hot & Cold</div>
                    <div class="cat-name">Coffee</div>
                </div>
                <div class="cat-img-wrap">
                    <div class="cat-emoji">☕</div>
                    <div class="cat-arrow">
                        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                            stroke-width="2.5">
                            <path d="M5 12h14M12 5l7 7-7 7" />
                        </svg>
                    </div>
                </div>
            </a>

            <!-- Bakery -->
            <a class="cat-card" href="{% url 'coffee:menu' %}?category=BAKERY">
                <div>
                    <div class="cat-label">Freshly Baked</div>
                    <div class="cat-name">Bakery</div>
                </div>
                <div class="cat-img-wrap">
                    <div class="cat-emoji">🥐</div>
                    <div class="cat-arrow">
                        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                            stroke-width="2.5">
                            <path d="M5 12h14M12 5l7 7-7 7" />
                        </svg>
                    </div>
                </div>
            </a>

            <!-- Cakes (Mapped to Bakery) -->
            <a class="cat-card" href="{% url 'coffee:menu' %}?category=BAKERY">
                <div>
                    <div class="cat-label">Sweet Treats</div>
                    <div class="cat-name">Cakes</div>
                </div>
                <div class="cat-img-wrap">
                    <div class="cat-emoji">🎂</div>
                    <div class="cat-arrow">
                        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                            stroke-width="2.5">
                            <path d="M5 12h14M12 5l7 7-7 7" />
                        </svg>
                    </div>
                </div>
            </a>

            <!-- Tea (Mapped to Hot) -->
            <a class="cat-card" href="{% url 'coffee:menu' %}?category=HOT">
                <div>
                    <div class="cat-label">Herbal & Leaf</div>
                    <div class="cat-name">Tea</div>
                </div>
                <div class="cat-img-wrap">
                    <div class="cat-emoji">🍵</div>
                    <div class="cat-arrow">
                        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                            stroke-width="2.5">
                            <path d="M5 12h14M12 5l7 7-7 7" />
                        </svg>
                    </div>
                </div>
            </a>

            <!-- Pastries (Mapped to Bakery) -->
            <a class="cat-card" href="{% url 'coffee:menu' %}?category=BAKERY">
                <div>
                    <div class="cat-label">Light Bites</div>
                    <div class="cat-name">Pastries</div>
                </div>
                <div class="cat-img-wrap">
                    <div class="cat-emoji">🧁</div>
                    <div class="cat-arrow">
                        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                            stroke-width="2.5">
                            <path d="M5 12h14M12 5l7 7-7 7" />
                        </svg>
                    </div>
                </div>
            </a>

            <!-- All Categories -->
            <a class="cat-card all-categories" href="{% url 'coffee:menu' %}">
                <div>
                    <div class="cat-label">Browse</div>
                    <div class="cat-name">All Categories</div>
                </div>
                <div class="all-arrow">
                    <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2.5">
                        <path d="M5 12h14M12 5l7 7-7 7" />
                    </svg>
                </div>
            </a>

        </div>
    </div>

    <script>
        // Generate floating petals
        const container = document.getElementById('petals');
        for (let i = 0; i < 18; i++) {
            const p = document.createElement('div');
            p.classList.add('petal');
            p.style.left = Math.random() * 100 + '%';
            p.style.top = Math.random() * 100 + '%';
            p.style.animationDuration = (6 + Math.random() * 8) + 's';
            p.style.animationDelay = (-Math.random() * 10) + 's';
            p.style.width = (6 + Math.random() * 6) + 'px';
            p.style.height = (10 + Math.random() * 8) + 'px';
            p.style.opacity = (0.15 + Math.random() * 0.25);
            container.appendChild(p);
        }
    </script>
</body>

</html>
